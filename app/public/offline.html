<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#AD0A09" />
  <title>Sin conexión · Mi Pueblo Cotati</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Nunito',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#F9F0DF;color:#2A1B0A;min-height:100dvh;display:grid;place-items:center;padding:24px;text-align:center}
    .card{max-width:420px;width:100%;background:#fff;border-radius:24px;padding:36px 28px;box-shadow:0 20px 50px rgba(0,0,0,.08);border:1px solid #EDE0C2}
    img{height:80px;width:auto;margin:0 auto 16px;display:block}
    h1{font-family:'Anton',Impact,sans-serif;text-transform:uppercase;letter-spacing:.04em;color:#AD0A09;font-size:28px;line-height:1.1;margin-bottom:10px}
    p{color:#6B5C42;line-height:1.5;margin-bottom:20px;font-size:15px}
    .actions{display:flex;flex-direction:column;gap:10px}
    a.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:14px;font-weight:800;text-decoration:none;text-transform:uppercase;font-size:13px;letter-spacing:.05em}
    .btn-primary{background:#AD0A09;color:#fff}
    .btn-primary:hover{background:#8a0807}
    .btn-outline{border:2px solid #AD0A09;color:#AD0A09;background:transparent}
    .btn-outline:hover{background:#AD0A09;color:#fff}
    .small{font-size:12px;color:#9B8A6B;margin-top:18px}
  </style>
</head>
<body>
  <div class="card">
    <img src="/logo.png" alt="Mi Pueblo Cotati" />
    <h1>Sin conexión</h1>
    <p>Parece que perdiste señal. Vuelve a intentarlo o llámanos directamente — siempre estamos al teléfono.</p>
    <div class="actions">
      <a class="btn btn-primary" href="tel:+17077924380">📞 Llámanos · (707) 792-4380</a>
      <a class="btn btn-outline" href="/" onclick="location.reload();return false;">Reintentar</a>
    </div>
    <p class="small">Mi Pueblo Cotati · Auténtica comida mexicana desde 1997</p>
  </div>
</body>
</html>
