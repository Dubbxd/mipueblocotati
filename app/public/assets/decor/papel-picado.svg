<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" preserveAspectRatio="xMidYMin slice">
  <!-- Banderines triangulares perforados estilo papel picado -->
  <defs>
    <pattern id="banner" x="0" y="0" width="60" height="80" patternUnits="userSpaceOnUse">
      <!-- Cuerda -->
      <path d="M0 6 Q15 2 30 6 T60 6" stroke="#7C0606" stroke-width="1.2" fill="none"/>
      <!-- Banderín rojo -->
      <g transform="translate(8 6)">
        <path d="M0 0 L44 0 L22 50 Z" fill="#AD0A09"/>
        <!-- perforaciones decorativas -->
        <circle cx="15" cy="10" r="2" fill="#F5ECD9"/>
        <circle cx="29" cy="10" r="2" fill="#F5ECD9"/>
        <circle cx="22" cy="18" r="3" fill="#F5ECD9"/>
        <circle cx="14" cy="24" r="1.6" fill="#F5ECD9"/>
        <circle cx="30" cy="24" r="1.6" fill="#F5ECD9"/>
        <path d="M22 30 l4 6 l-4 0 l-4 0 z" fill="#F5ECD9"/>
        <circle cx="22" cy="42" r="1.4" fill="#F5ECD9"/>
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="80" fill="url(#banner)"/>
</svg>
