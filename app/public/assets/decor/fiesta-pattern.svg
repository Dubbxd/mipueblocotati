<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <pattern id="fiesta" x="0" y="0" width="240" height="240" patternUnits="userSpaceOnUse">
      <g fill="#AD0A09" fill-opacity="0.55">
        <!-- Chile (top left) -->
        <g transform="translate(30 36) rotate(-20)">
          <path d="M0 0 Q-4 22 6 38 Q22 50 32 36 Q34 18 18 4 Z"/>
          <path d="M14 -4 q4 -10 14 -8 q-2 6 -10 10 z" fill="#16823a" fill-opacity="0.8"/>
        </g>
        <!-- Calavera (top center) -->
        <g transform="translate(110 28)">
          <ellipse cx="14" cy="14" rx="14" ry="13"/>
          <rect x="9" y="26" width="10" height="6" rx="1"/>
          <circle cx="9" cy="13" r="3" fill="#1A0E08"/>
          <circle cx="19" cy="13" r="3" fill="#1A0E08"/>
          <path d="M11 22 l3 4 l3 -4" stroke="#1A0E08" stroke-width="1.4" fill="none"/>
        </g>
        <!-- Sombrero (top right) -->
        <g transform="translate(186 36)">
          <ellipse cx="20" cy="22" rx="22" ry="6"/>
          <ellipse cx="20" cy="14" rx="11" ry="11"/>
          <path d="M9 14 q11 -6 22 0" fill="#7C0606"/>
        </g>
        <!-- Guitarra (middle left) -->
        <g transform="translate(24 100) rotate(15)">
          <ellipse cx="12" cy="28" rx="14" ry="16"/>
          <circle cx="12" cy="28" r="5" fill="#1A0E08"/>
          <rect x="9" y="-4" width="6" height="22" rx="1"/>
          <rect x="7" y="-10" width="10" height="6" rx="1"/>
        </g>
        <!-- Maraca (middle center) -->
        <g transform="translate(108 108) rotate(-25)">
          <ellipse cx="14" cy="14" rx="14" ry="14"/>
          <rect x="11" y="24" width="6" height="22" rx="2"/>
          <circle cx="9" cy="11" r="1.4" fill="#F5ECD9"/>
          <circle cx="17" cy="14" r="1.4" fill="#F5ECD9"/>
          <circle cx="13" cy="18" r="1.4" fill="#F5ECD9"/>
        </g>
        <!-- Tequila bottle (middle right) -->
        <g transform="translate(190 100)">
          <rect x="8" y="14" width="18" height="34" rx="2"/>
          <rect x="13" y="0" width="8" height="14" rx="1"/>
          <rect x="11" y="22" width="12" height="8" fill="#F5ECD9" fill-opacity="0.5"/>
        </g>
        <!-- Maíz (bottom left) -->
        <g transform="translate(30 184) rotate(-10)">
          <ellipse cx="10" cy="20" rx="9" ry="20"/>
          <path d="M2 10 q-4 -8 6 -10 q4 6 -2 14" fill="#16823a" fill-opacity="0.8"/>
          <circle cx="6" cy="12" r="1.2" fill="#F5ECD9"/>
          <circle cx="12" cy="14" r="1.2" fill="#F5ECD9"/>
          <circle cx="8" cy="20" r="1.2" fill="#F5ECD9"/>
          <circle cx="14" cy="22" r="1.2" fill="#F5ECD9"/>
          <circle cx="10" cy="28" r="1.2" fill="#F5ECD9"/>
        </g>
        <!-- Lima (bottom center) -->
        <g transform="translate(112 192) rotate(20)">
          <circle cx="14" cy="14" r="14" fill="#16823a" fill-opacity="0.85"/>
          <circle cx="14" cy="14" r="9" fill="#F5ECD9" fill-opacity="0.85"/>
          <path d="M14 5 v18 M5 14 h18" stroke="#16823a" stroke-width="1.2"/>
        </g>
        <!-- Estrella decorativa (bottom right) -->
        <g transform="translate(196 188)">
          <path d="M16 0 l4 12 l12 0 l-10 8 l4 12 l-10 -7 l-10 7 l4 -12 l-10 -8 l12 0 z"/>
        </g>
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#fiesta)"/>
</svg>
