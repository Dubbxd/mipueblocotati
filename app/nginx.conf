server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──────────────────────────────────────────
    add_header X-Frame-Options            "SAMEORIGIN"                     always;
    add_header X-Content-Type-Options     "nosniff"                        always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy
        "default-src 'self'; \
         script-src 'self' 'unsafe-inline'; \
         style-src 'self' 'unsafe-inline'; \
         img-src 'self' data: blob: https:; \
         font-src 'self' data:; \
         connect-src 'self' https:; \
         frame-ancestors 'none'; \
         form-action 'self'; \
         base-uri 'self';"
        always;
    # Hide server version
    server_tokens off;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # Proxy API requests to the api service
    location /api/ {
        proxy_pass         http://api:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Proxy file uploads served by the API
    location /uploads/ {
        proxy_pass         http://api:3001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_cache_valid  200 7d;
    }

    # Swagger docs — blocked in production (set SWAGGER_ENABLED=true on the API to expose)
    location /docs {
        return 403;
    }

    # Long-term cache for hashed static assets (Vite adds hash to filename)
    location ~* \.(js|css|woff2?|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # No-cache for HTML (so new deploys are picked up immediately)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri /index.html;
    }

    # SPA fallback — all unknown routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
