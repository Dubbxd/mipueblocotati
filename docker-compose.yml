# Mi Pueblo Cotati — Docker Compose
# Used for Dokploy deployment and local container testing.
#
# Quick start (local):
#   cp .env.example .env   # fill in your values
#   docker compose up --build
#
# In production (Dokploy):
#   Configure each variable in the Dokploy environment panel, then deploy.

name: mipueblo

services:
  # ── API — Bun / Elysia ───────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      NODE_ENV: production
      PORT: "3001"

      # Database
      DATABASE_URL: ${DATABASE_URL}

      # Auth
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      # CORS — set to the production frontend URL
      CORS_ORIGIN: ${CORS_ORIGIN}

      # Mailjet
      MAILJET_API_KEY: ${MAILJET_API_KEY:-}
      MAILJET_SECRET_KEY: ${MAILJET_SECRET_KEY:-}
      MAILJET_FROM_EMAIL: ${MAILJET_FROM_EMAIL:-noreply@mipueblocotati.com}
      MAILJET_FROM_NAME: ${MAILJET_FROM_NAME:-Mi Pueblo Cotati}
      MAILJET_ADMIN_EMAIL: ${MAILJET_ADMIN_EMAIL:-}

      # Public URLs
      PUBLIC_URL: ${PUBLIC_URL}
      API_URL: ${API_URL:-}

      # OpenAI (blog / campaign AI generation)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      # Storage
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      UPLOAD_DIR: /app/uploads
      PUBLIC_UPLOADS_URL: ${PUBLIC_UPLOADS_URL}

      # S3-compatible storage (set STORAGE_DRIVER=s3 to enable)
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      S3_USE_PRESIGNED: ${S3_USE_PRESIGNED:-false}
      S3_PRESIGN_EXPIRES: ${S3_PRESIGN_EXPIRES:-604800}

      # Email logo — baked into the image at /app/email-logo.png
      LOGO_PATH: /app/email-logo.png

    networks:
      - default
      - dokploy-network
    volumes:
      - uploads:/app/uploads

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

  # ── Web — Vue SPA served by nginx ────────────────────────────────
  web:
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy

networks:
  dokploy-network:
    external: true

volumes:
  # Named volume so uploaded files survive container restarts/updates
  uploads:
